# webserv.conf

server {
    listen 127.0.0.1:8080;
    server_name localhost webserv.com;
    
    # Global settings for this specific server
    client_max_body_size 10M;
    error_page 404 ./www/errors/404.html;
    error_page 500 502 503 504 ./www/errors/50x.html;

    # Default route
    location / {
        root ./www;
        index index.html index.htm;
        allow_methods GET POST;
        upload_store /var/www/uploads/tmp;
        autoindex on;
    }

    # Route specifically for uploading files
    location /uploads {
        root ./www/uploads;
        allow_methods GET POST DELETE;
        upload_store /var/www/uploads/tmp;
    }

    # Route for executing CGI scripts
    location /cgi-bin {
        root ./www/cgi-bin;
        allow_methods GET POST;
        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php-cgi;
    }

	# Route specifically for redirection
	location /old-page {
        return 301 /new-page.html;
    }
}

# You can define multiple servers running on different ports
server {
    listen 9090;
    server_name test.local;
    
    location / {
        root /var/www/test;
        index test.html;
        allow_methods GET;
    }
}
