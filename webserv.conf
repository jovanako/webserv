# webserv.conf

server {
    listen 127.0.0.1:8080;
    server_name localhost webserv.com;
    
    # Global settings for this specific server
    client_max_body_size 100M;
    error_page 404 ./www/errors/404.html;
    error_page 500 502 503 504 ./www/errors/50x.html;
	cgi_pass .bla ./cgi_test;

    # Default route
    location / {
        root ./www;
        index index.html index.htm;
        allow_methods GET;
    }
    
    location /directory/ {
        root ./YoupiBanane;
        index youpi.bad_extension;
        allow_methods GET POST;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }
}